<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>订阅矫正</title>
    <meta name="description" content="订阅矫正：拉取原订阅，套用覆写脚本，输出成品订阅。客户端只导入输出地址，靠自带的定时更新自动同步脚本。" />
    <meta property="og:title" content="Subscription Braces" />
    <meta property="og:site_name" content="Subscription Braces" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // 主题初始化（在渲染前执行，避免闪烁）：localStorage sm-theme = light | dark，缺省跟随系统
      (function () {
        var m = window.matchMedia("(prefers-color-scheme: dark)");
        var set = function () {
          var p = null;
          try { p = localStorage.getItem("sm-theme"); } catch (e) {}
          var dark = p === "dark" || (p !== "light" && m.matches);
          document.documentElement.dataset.mode = dark ? "dark" : "light";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        };
        set();
        m.addEventListener("change", set);
      })();
    </script>
    <!--PAGE_DATA-->
  </head>
  <body class="bg-kumo-canvas text-kumo-default">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
