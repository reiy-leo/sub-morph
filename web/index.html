<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>订阅矫正</title>
    <meta name="description" content="订阅矫正：拉取原订阅，套用覆写脚本，输出成品订阅。客户端只导入输出地址，靠自带的定时更新自动同步脚本。" />
    <meta property="og:title" content="Subscription Braces" />
    <meta property="og:site_name" content="Subscription Braces" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f6821f'/%3E%3Cpath d='M8 11h10l-3-3M24 21H14l3 3' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // 主题初始化（在渲染前执行，避免闪烁）：localStorage sm-theme = light | dark，缺省跟随系统
      (function () {
        var m = window.matchMedia("(prefers-color-scheme: dark)");
        var set = function () {
          var p = null;
          try { p = localStorage.getItem("sm-theme"); } catch (e) {}
          var dark = p === "dark" || (p !== "light" && m.matches);
          document.documentElement.dataset.mode = dark ? "dark" : "light";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        };
        set();
        m.addEventListener("change", set);
      })();
    </script>
    <!--PAGE_DATA-->
  </head>
  <body class="bg-kumo-canvas text-kumo-default">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
